    main_station: 2

tom:
  label: {en: "Tom, economics, goes out a lot", de: "Tom, Wirtschaft, oft unterwegs"}
  programme: economics
  modes: [walk, bike]
  destinations:
    campus_site: 2
    nightlife: {importance: 3, trips_per_week: 2}
    sport:football: 1
    mensa: 2
