    "Auf der Morgenstelle 28": ["^E-Bau", "\\bAdM 28\\b"]
    "Auf der Morgenstelle 3": ["\\bAdM 3\\b"]
    "Auf der Morgenstelle 32-34": [IFIB, ZMBP, "\\bAdM 3[24]\\b"]
    "Schnarrenbergstraße 94-96": [Geo- und Umweltforschungszentrum, "\\bGUZ\\b"]
    "Maria-von-Linden-Straße 1": ["MVL ?1\\b"]
    "Maria-von-Linden-Straße 6": ["MVL ?6\\b", Cyber Valley]
    "Sand 1": ["Informatik/Astronomie"]
