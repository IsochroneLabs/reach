    "Wilhelmstraße 124": [Sportwissenschaft, SPORTHALLE, "\\bIfS\\b", "Wächterstr\\. 67"]   # Institut für Sportwissenschaft
    "Wilhelmstraße 133": [Sinologie, Koreanistik]
    "Wilhelmstraße 113": ["\\bAOI\\b", Orient]
    "Wilhelmstraße 90": [Japanologie]
    "Wächterstraße 76": ["\\bZDV\\b"]
    "Europastraße 6": ["Empirische Bildungsforschung"]
