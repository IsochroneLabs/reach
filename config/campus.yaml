    computer_science: ["INF(?!O)", "INFM", "MDZINF", "MEINF", "BIOINF", "KOG"]
    data_science_ml: ["ML", "DS\\d", "DS-"]   # not QDS: the psychology master (N30)
    mathematics: ["MAT"]
    physics: ["PHY", "NANO"]
    chemistry: ["CHE"]
    biology: ["Bio(?!INF)", "BIO(?!INF)", "BCH", "GTCNEURO"]
    pharmacy: ["PHA"]
    psychology: ["PSY", "QDS"]
    economics: ["WiWi", "WIWI", "WW", "ECO", "BWL", "VWL", "S\\d"]   # S100… are WiWi modules (N30)
    law: ["JUR", "RW", "Jura"]
