# Campus areas, Mensa list, university sports and the Alma matching rules (meth. §3, §3.2, notes
# N8, N30, N31). The routed campus destinations are teaching buildings, generated together with the
# programmes by `uv run python -m reach_pipeline.programmes build` into campus_buildings.csv and
# programmes.csv next to this file (reviewed and committed). Coordinates: [lon, lat] in EPSG:4326,
# checked against OSM on 27 Nov 2026 (notes N29); the pipeline routes to these points (meth. §3).

match_radius_m: 250

# Areas group the teaching buildings for display and the default mix; every official building
# belongs to its nearest area (config/university_buildings.csv, notes N30).
areas:
  tal:
    name: Tal (Neue Aula, Kupferbau, Brechtbau)
    point: [9.0600, 48.5258]   # Wilhelmstraße between Neue Aula, Kupferbau and Brechtbau (OSM)
  morgenstelle:
    name: Morgenstelle
    point: [9.0352, 48.5371]   # Hörsaalzentrum Morgenstelle (OSM)
  sand:
    name: Sand (Computer science, sports science)
    point: [9.0712, 48.5348]   # Sand 1–14 (OSM addresses)
  schnarrenberg:
    name: Schnarrenberg (University Hospital)
    point: [9.0381, 48.5302]   # CRONA-Kliniken (OSM)
  # Added 27 Nov 2026 (notes N30): the official address list puts Altstadt (Karte D) and the
  # Cyber Valley campus (Karte C) 750–1 270 m from every other site; both teach many hours.
  altstadt:
    name: Altstadt (Alte Aula, Burse, Schloss)
    point: [9.0557, 48.5198]   # Alte Aula, Münzgasse 30 (OSM building=university)
  cyber_valley:
    name: Cyber Valley (Maria-von-Linden-Straße)
    point: [9.0561, 48.5389]   # Tübingen AI Research Building, Maria-von-Linden-Straße 6 (OSM)

mensas:
  mensa_wilhelmstrasse:
    name: Mensa Wilhelmstraße
    point: [9.0616, 48.5262]
  mensa_morgenstelle:
    name: Mensa Morgenstelle
    point: [9.0353, 48.5375]
  mensa_prinz_karl:
    name: Mensa Prinz Karl
    point: [9.0560, 48.5205]

university_sports:
  sports_ground:
    name: University sports grounds (Wilhelmstraße)
    point: [9.0700, 48.5300]

# Default campus mix while the student has chosen no programme (product v1.1, notes N16; decided
# 24 Nov 2026): area → share of the campus time. Inside an area the share is split over its
# teaching buildings by their weekly session hours (notes N31).
default_mix:
  tal: 0.5
  morgenstelle: 0.5

# Programmes Alma does not show with rooms in the reference week (basis "override"); they win over
# Alma. Buildings are ids of campus_buildings.csv.
programme_overrides: {}

# Alma courses → programme × building hours (`reach_pipeline.programmes build`, notes N31).
alma:
  max_session_h: 6             # longer entries are all-day blocks or placeholders
  # degrees offered in the profile (as Alma writes them) → label
  degrees:
    Bachelor: {en: Bachelor, de: Bachelor}
    Master: {en: Master, de: Master}
    Bachelor of Education: {en: Bachelor of Education, de: Bachelor of Education}
    Master of Education: {en: Master of Education, de: Master of Education}
    Staatsexamen: {en: State examination, de: Staatsexamen}
    Magister / Magistra Theologiae: {en: Magister Theologiae, de: Magister Theologiae}
  # a module whose name matches is elective; a course counts as compulsory for a programme if one
  # of its modules for that programme does not match (case-insensitive regexes)
  elective_modules: [Wahl, Elective, Freie, Profil, Ergänzung, Erweiterung, Vertiefung, Schwerpunkt,
    "Speciali[sz]", "Focus Module", Studienbereich, Kontext, Interdisziplin, Interdisciplin, Optional,
    "Studium Generale", Schlüsselqualifikation, Überfachlich, Fachübergreifend, Zusatz]
  min_compulsory_h: 2          # fewer compulsory hours in the week → use all courses (basis "all")
  cluster_radius_m: 60         # official buildings closer than this are one destination
  min_share: 0.05              # buildings with less of a programme's hours are dropped
  # official building (title in config/university_buildings.csv, from the university's address
  # list) → case-insensitive regexes on the building Alma prints after the room; first match wins.
  building_addresses:
    "Brechtbau – Neuphilologikum – Wilhelmstraße 50": [Neuphilologicum, Brechtbau]
    "Auf der Morgenstelle 16": [Hörsaalzentrum, "Verfügungsgeb\\. Morgenstelle"]
    "Auf der Morgenstelle 10": ["^C-Bau"]
    "Auf der Morgenstelle 14": ["^D-Bau"]
    "Auf der Morgenstelle 18": ["^A-Bau"]
    "Auf der Morgenstelle 8": ["^B-Bau"]
    "Auf der Morgenstelle 6": ["^H-Bau"]
