# Campus sites, Mensa list, university sports and programme → site table (meth. §3, notes N8).
# DRAFT (S0.3) from general knowledge: every name, programme assignment and coordinate is
# [VERIFY] — the team checks it against the university's own information in S1.6, and the pipeline
# matches each site to an OSM feature within match_radius_m and checks that it is routable (V3).
# Coordinates: approximate [lon, lat] in EPSG:4326, only used to find the OSM feature.

match_radius_m: 250

sites:
  tal:
    name: Tal (Wilhelmstraße, Neue Aula, Kupferbau)
    point: [9.0620, 48.5250]
  morgenstelle:
    name: Morgenstelle
    point: [9.0350, 48.5370]
  sand:
    name: Sand
    point: [9.0670, 48.5340]
  schnarrenberg:
    name: Schnarrenberg (University Hospital)
    point: [9.0400, 48.5320]

mensas:
  mensa_wilhelmstrasse:
    name: Mensa Wilhelmstraße
    point: [9.0616, 48.5262]
  mensa_morgenstelle:
    name: Mensa Morgenstelle
    point: [9.0353, 48.5375]
  mensa_prinz_karl:
    name: Mensa Prinz Karl
    point: [9.0560, 48.5205]

university_sports:
  sports_ground:
    name: University sports grounds (Wilhelmstraße)
    point: [9.0700, 48.5300]

# Default campus mix while the student has chosen no programme (product v1.1, notes N16; decided
# 24 Nov 2026): site → share of the campus time. Read by the API once `programme` is optional
# (notes N17); the web app names these sites in the profile panel.
default_mix:
  tal: 0.5
  morgenstelle: 0.5

# Programme → sites the student travels to for lectures (several = mean time, meth. §6).
programmes:
  computer_science: {label: {en: Computer science, de: Informatik}, sites: [sand, morgenstelle]}
  # [VERIFY] site(s) of the Data Science / Machine Learning programmes.
  data_science_ml: {label: {en: Data science / machine learning, de: Data Science / Machine Learning}, sites: [sand]}
  mathematics: {label: {en: Mathematics, de: Mathematik}, sites: [morgenstelle]}
  physics: {label: {en: Physics, de: Physik}, sites: [morgenstelle]}
  chemistry: {label: {en: Chemistry, de: Chemie}, sites: [morgenstelle]}
  biology: {label: {en: Biology, de: Biologie}, sites: [morgenstelle]}
  pharmacy: {label: {en: Pharmacy, de: Pharmazie}, sites: [morgenstelle]}
  medicine: {label: {en: Medicine, de: Medizin}, sites: [morgenstelle, schnarrenberg]}
  economics: {label: {en: Economics and business, de: Wirtschaftswissenschaft}, sites: [tal]}
  law: {label: {en: Law, de: Rechtswissenschaft}, sites: [tal]}
  humanities: {label: {en: Humanities, de: Geisteswissenschaften}, sites: [tal]}
  social_sciences: {label: {en: Social sciences, de: Sozialwissenschaften}, sites: [tal]}
  psychology: {label: {en: Psychology, de: Psychologie}, sites: [tal]}
  sports_science: {label: {en: Sports science, de: Sportwissenschaft}, sites: [tal]}

# Alma sessions → programme × site hours (F3.3, `python -m reach_pipeline.alma shares`).
# building_sites: site → case-insensitive regexes on the building name Alma prints in brackets
# after the room; first match wins. programme_numbers: programme → regexes on the start of the
# module number; sessions without a number or with an unknown one do not count.
alma:
  max_session_h: 6             # longer entries are all-day blocks or placeholders
  building_sites:
    morgenstelle: [Morgenstelle, "\\bAdM\\b", "^[A-E]-Bau", "^N-Bau", Geo- und Umweltforschungszentrum, "Maria-von-Linden", Kristallographie, "Mineralogie", "Hörsaalzentrum"]
    sand: ["^Sand\\b", "Informatik", "Terrassenbau", "Wilhelm-Schickard"]
    schnarrenberg: ["^(?!Alte).*Klinik", "CRONA", "Hoppe-Seyler", "Otfried-Müller", "Schnarrenberg", "Elfriede-Aulhorn", "Röntgenweg"]
    tal: [Neuphilologicum, "Neue Aula", Kupferbau, Hegelbau, Brechtbau, "Alte Frauenklinik", Theologicum, Schloss, "Hölderlin", "Sigwart", "WiWi", "Mohl", "Kepler", "Alte Archäologie", "\\bIfE\\b", "Clubhaus", "Wilhelmstr", "Nauklerstr", "Keltern", "Doblerstr", "Gmelinstr", "Münzgasse", "Bursagasse", "Holzmarkt", "Pfleghof", "Alte Physiologie", "Alte Botanik", "Liebermeister", "Psychologisches Institut", "Schleichstr", "Melanchthonstr", "Corrensstr", "Ammerbau", "Prinz Karl", "Sportinstitut", "Mensa Wilhelm"]
  programme_numbers:
    computer_science: ["INF(?!O)", "INFM", "MDZINF", "MEINF", "BIOINF", "KOG"]
    data_science_ml: ["ML", "DS\\d", "DS-", "QDS"]
    mathematics: ["MAT"]
    physics: ["PHY", "NANO"]
    chemistry: ["CHE"]
    biology: ["Bio(?!INF)", "BIO(?!INF)", "BCH", "GTCNEURO"]
    pharmacy: ["PHA"]
    medicine: ["S\\d", "MEDZ"]
    psychology: ["PSY"]
    economics: ["WiWi", "WIWI", "WW", "ECO", "BWL", "VWL"]
    law: ["JUR", "RW", "Jura"]
    sports_science: ["SPO", "Spo"]
