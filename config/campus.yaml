# Campus sites, Mensa list, university sports and programme → site table (meth. §3, notes N8).
# DRAFT (S0.3) from general knowledge: every name, programme assignment and coordinate is
# [VERIFY] — the team checks it against the university's own information in S1.6, and the pipeline
# matches each site to an OSM feature within match_radius_m and checks that it is routable (V3).
# Coordinates: [lon, lat] in EPSG:4326 of the main lecture buildings, checked against OSM on
# 27 Nov 2026 (notes N29); the pipeline routes to these points (meth. §3).

match_radius_m: 250

sites:
  tal:
    name: Tal (Neue Aula, Kupferbau, Brechtbau)
    point: [9.0600, 48.5258]   # Wilhelmstraße between Neue Aula, Kupferbau and Brechtbau (OSM)
  morgenstelle:
    name: Morgenstelle
    point: [9.0352, 48.5371]   # Hörsaalzentrum Morgenstelle (OSM)
  sand:
    name: Sand (Computer science, sports science)
    point: [9.0712, 48.5348]   # Sand 1–14 (OSM addresses)
  schnarrenberg:
    name: Schnarrenberg (University Hospital)
    point: [9.0381, 48.5302]   # CRONA-Kliniken (OSM)
  # Added 27 Nov 2026 (notes N30): the official address list puts Altstadt (Karte D) and the
  # Cyber Valley campus (Karte C) 750–1 270 m from every other site; both teach many hours.
  altstadt:
    name: Altstadt (Alte Aula, Burse, Schloss)
    point: [9.0557, 48.5198]   # Alte Aula, Münzgasse 30 (OSM building=university)
  cyber_valley:
    name: Cyber Valley (Maria-von-Linden-Straße)
    point: [9.0561, 48.5389]   # Tübingen AI Research Building, Maria-von-Linden-Straße 6 (OSM)

mensas:
  mensa_wilhelmstrasse:
    name: Mensa Wilhelmstraße
    point: [9.0616, 48.5262]
  mensa_morgenstelle:
    name: Mensa Morgenstelle
    point: [9.0353, 48.5375]
  mensa_prinz_karl:
    name: Mensa Prinz Karl
    point: [9.0560, 48.5205]

university_sports:
  sports_ground:
    name: University sports grounds (Wilhelmstraße)
    point: [9.0700, 48.5300]

# Default campus mix while the student has chosen no programme (product v1.1, notes N16; decided
# 24 Nov 2026): site → share of the campus time. Read by the API once `programme` is optional
# (notes N17); the web app names these sites in the profile panel.
default_mix:
  tal: 0.5
  morgenstelle: 0.5

# Programme → sites the student travels to for lectures (several = mean time, meth. §6).
# shares: weight of each site in the campus time, from the session hours of the Alma reference
# week WS 2026/27 (`python -m reach_pipeline.alma shares`, notes N24; sites below 10 % dropped,
# rest rounded). Since 27 Nov 2026 (N30) each Alma building is mapped to the university's official
# address list and from there to its nearest site (config/university_buildings.csv). Programmes without shares keep the hand-made sites with equal weights; biology,
# chemistry, mathematics, pharmacy, physics (Morgenstelle) and psychology (Tal) were confirmed.
programmes:
  computer_science: {label: {en: Computer science, de: Informatik}, sites: [morgenstelle, sand, cyber_valley, tal], shares: [0.56, 0.18, 0.13, 0.13]}
  data_science_ml: {label: {en: Data science / machine learning, de: Data Science / Machine Learning}, sites: [cyber_valley, morgenstelle, tal], shares: [0.68, 0.18, 0.14]}
  mathematics: {label: {en: Mathematics, de: Mathematik}, sites: [morgenstelle]}
  physics: {label: {en: Physics, de: Physik}, sites: [morgenstelle]}
  chemistry: {label: {en: Chemistry, de: Chemie}, sites: [morgenstelle]}
  biology: {label: {en: Biology, de: Biologie}, sites: [morgenstelle]}
  pharmacy: {label: {en: Pharmacy, de: Pharmazie}, sites: [morgenstelle]}
  # Medicine is not in Alma's day view (its S-numbers were economics, N30): the faculty's teaching
  # buildings from the address list (Elfriede-Aulhorn-Straße 8/10) and the Hörsaalzentrum.
  medicine: {label: {en: Medicine, de: Medizin}, sites: [schnarrenberg, morgenstelle]}
  economics: {label: {en: Economics and business, de: Wirtschaftswissenschaft}, sites: [tal, morgenstelle], shares: [0.9, 0.1]}
  law: {label: {en: Law, de: Rechtswissenschaft}, sites: [tal]}
  # Faculty estimate (N30): hours of sessions without a programme in the buildings of the faculty.
  humanities: {label: {en: Humanities, de: Geisteswissenschaften}, sites: [tal, altstadt], shares: [0.85, 0.15]}
  social_sciences: {label: {en: Social sciences, de: Sozialwissenschaften}, sites: [tal, altstadt], shares: [0.7, 0.3]}
  psychology: {label: {en: Psychology, de: Psychologie}, sites: [tal]}
  # Institut für Sportwissenschaft, Wilhelmstraße 124: nearest site Sand (650 m, N30).
  sports_science: {label: {en: Sports science, de: Sportwissenschaft}, sites: [sand]}

# Alma sessions → programme × site hours (F3.3, `python -m reach_pipeline.alma shares`).
# building_sites: site → case-insensitive regexes on the building name Alma prints in brackets
# after the room; first match wins. programme_numbers: programme → regexes on the start of the
# module number; sessions without a number or with an unknown one do not count.
alma:
  max_session_h: 6             # longer entries are all-day blocks or placeholders
  # official building (title in config/university_buildings.csv, from the university's address
  # list) → case-insensitive regexes on the building Alma prints after the room; first match wins.
  # The site of a building is its nearest campus site (`uni_buildings build`, notes N30).
  building_addresses:
    "Brechtbau – Neuphilologikum – Wilhelmstraße 50": [Neuphilologicum, Brechtbau]
    "Auf der Morgenstelle 16": [Hörsaalzentrum, "Verfügungsgeb\\. Morgenstelle"]
    "Auf der Morgenstelle 10": ["^C-Bau"]
    "Auf der Morgenstelle 14": ["^D-Bau"]
    "Auf der Morgenstelle 18": ["^A-Bau"]
    "Auf der Morgenstelle 8": ["^B-Bau"]
    "Auf der Morgenstelle 6": ["^H-Bau"]
    "Auf der Morgenstelle 24": ["^F-Bau", "\\bAdM 24\\b"]
    "Auf der Morgenstelle 28": ["^E-Bau", "\\bAdM 28\\b"]
    "Auf der Morgenstelle 3": ["\\bAdM 3\\b"]
    "Auf der Morgenstelle 32-34": [IFIB, ZMBP, "\\bAdM 3[24]\\b"]
    "Schnarrenbergstraße 94-96": [Geo- und Umweltforschungszentrum, "\\bGUZ\\b"]
    "Maria-von-Linden-Straße 1": ["MVL ?1\\b"]
    "Maria-von-Linden-Straße 6": ["MVL ?6\\b", Cyber Valley]
    "Sand 1": ["Informatik/Astronomie"]
