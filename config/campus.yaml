    "Sand 6/7": ["Informatik/Kriminologie", Kriminologie]
    "Hegelbau – Wilhelmstraße 36": [Hegelbau]
    "Geschwister-Scholl-Platz": ["Neue Aula"]
    "Hölderlinstraße 5 – Kupferbau": [Kupferbau]
    "Schleichstraße 4": ["Alte Frauenklinik", "Psychologisches Institut"]   # psychology
    "Keplerstraße 2": ["OSA-Keplerstr", Oberschulamt]
    "Mohlstraße 36": ["WiWi Sem Mohl", Mohlstr]
    "Nauklerstraße 47": ["WiWi Naukler"]
    "Nauklerstraße 35": ["Nauklerstr\\. 35"]
    "Liebermeisterstraße 12 bis 16": [Theologicum]
    "Liebermeisterstraße 18": ["Liebermeisterstr\\. 18"]
    "Hölderlinstraße 12 (Eckgebäude mit Sigwartstraße 10)": ["Hölderlinstraße/Sigwartstraße"]
    "Wilhelmstraße 22": ["Haus der Sprachen"]
    "Rümelinstraße 19-23": [Geographie]
