# reach configuration — every tunable value of the pipeline lives here (AGENTS.md rule 4).
# Loaded and validated by reach_pipeline.config.load_config. Distances in metres (EPSG:25832),
# speeds in km/h, times in minutes. Sources: docs/architecture.md (arch.), docs/methodology.md (meth.).

# Local directory for raw downloads and per-run outputs (git-ignored).
data_dir: data

study_area:
  # Display name of the city; used in reports and the app.
  city_name: Tübingen
  # Administrative city boundary (arch. §4): OSM boundary=administrative relation selected by
  # admin_level and the official municipality key (AGS). Defines the scoring scope (every
  # populated cell with its centre inside is scored, O11) and the routing area; clips the urban
  # boundary. AGS checked against the extract on 2 Nov 2026.
  admin_boundary:
    admin_level: 8
    ags: "08416041"
  # Urban (settlement) boundary, decision O17 option (a): built-up OSM land use inside the city,
  # dissolved, gaps closed by buffering out and in, small fragments dropped; Teilorte stay
  # separate parts. Only for the map area, the live-endpoint check and recommender candidates;
  # it does not limit who is scored (O11).
  urban_boundary:
    # OSM landuse values counted as built-up. industrial is left out: it joins Teilorte
    # (Bühl–Kilchberg, Kernstadt–Weilheim; P2 measurement, OSM 2026-11-01).
    landuse: [residential, commercial, retail, education, institutional, religious]
    # Buffer distance for closing gaps: buffer(+closing_m).buffer(-closing_m); 100 m joins no
    # Teilorte (P2 measurement).
    closing_m: 100
    # Parts smaller than this are dropped.
    min_part_area_m2: 10000
  # Routing network and facilities = city boundary + this buffer (arch. §4, O13). Must be at
  # least the largest prefilter reach of all profiles (O20); the loader checks this.
  routing_buffer_m: 4000
  # Optional clip box [min_lon, min_lat, max_lon, max_lat] in EPSG:4326; null = whole study area.
  # Set by config/test_clip.yaml.
  clip_bbox: null

districts:
  # OSM admin_levels whose boundaries are the districts for cells.district_id (C8). Tübingen
  # mixes levels: 9 = the eight Teilorte, 11 = the 23 districts of the core town; level 10
  # (Derendingen, Lustnau) overlaps level 11 and is not used (Geofabrik extract, 2 Nov 2026).
  admin_levels: [9, 11]
  # validate fails if gaps or overlaps of these districts exceed this share of the city area.
  coverage_tolerance_pct: 0.5

# Time budgets in minutes (meth. §1).
time_budgets_min:
  # Facilities of every category.
  facilities: 15
  # Public transport stops (walking and wheelchair profiles only).
  transit: 10

# Travel profiles (arch. §6.1, meth. §1). The pipeline passes speed_kmh to Valhalla as
# walking_speed (pedestrian) or cycling_speed (bicycle); costing_options holds every other
# option. Options without a value in the docs (e.g. step_penalty) stay at Valhalla's defaults
# until P3 checks them.
# Prefilter reach (O20) = speed_kmh * max_speed_factor * budget + prefilter_margin_m.
profiles:
  walking_339:
    # Inclusive default: 850 m in 15 min.
    costing: pedestrian
    speed_kmh: 3.39
    costing_options: {}
    max_speed_factor: 1.0
    prefilter_margin_m: 0
    # Whether transit supply (meth. §3) is computed for this profile.
    transit: true
  walking_500:
    # Comparison profile: 1,250 m in 15 min.
    costing: pedestrian
    speed_kmh: 5.0
    costing_options: {}
    max_speed_factor: 1.0
    prefilter_margin_m: 0
    transit: true
  cycling_15:
    # 3,750 m in 15 min; use_hills stays at Valhalla's default (O7, O15).
    costing: bicycle
    speed_kmh: 15.0
    costing_options:
      bicycle_type: Hybrid
    # Provisional 1.0; replaced by the measured maximum speed ratio in P3 (O20).
    max_speed_factor: 1.0
    prefilter_margin_m: 0
    transit: false
  wheelchair_339:
    # Pedestrian costing with type wheelchair: avoids steps, not steep sections (max_grade
    # excludes no edges in Valhalla 3.9.1; routes keep 12–20 % grades, notes N11, arch. §6.1).
    costing: pedestrian
    speed_kmh: 3.39
    costing_options:
      type: wheelchair
    max_speed_factor: 1.0
    prefilter_margin_m: 0
    transit: true

# Facility categories (meth. §2, M1 defaults). k = number of facilities needed for "sufficient".
# tags: OSM key/value pairs; a feature matching any pair belongs to the category.
# location: "point" = node as is, polygon -> representative point;
#           "access_points" = access points on the boundary (parks and playgrounds, see below).
categories:
  - id: grocery
    name: Grocery
    k: 2
    tags: [{shop: supermarket}]
    location: point
  - id: pharmacy
    name: Pharmacy
    k: 1
    tags: [{amenity: pharmacy}]
    location: point
  - id: doctors
    name: Doctors
    k: 2
    tags: [{amenity: doctors}]
    location: point
  - id: childcare
    name: Childcare
    k: 2
    tags: [{amenity: kindergarten}, {amenity: childcare}]
    location: point
  - id: school
    name: School
    k: 1
    tags: [{amenity: school}]
    location: point
  - id: parks
    name: Parks & playgrounds
    k: 1
    tags: [{leisure: park}, {leisure: playground}]
    location: access_points

# Access points for categories with location "access_points" (meth. §2): intersections of
# walkable ways with the boundary; fallback points every spacing_m along the boundary; at most
# max_points per park, chosen evenly spaced (max_points is an assumption, checked in P2).
access_points:
  spacing_m: 50
  max_points: 20
  # Park outlines kept for display are simplified with this tolerance (m); display only.
  outline_simplify_m: 2
  # OSM highway values of the walkable ways whose crossings with a park boundary are access points.
  walkable_highways:
    [footway, path, pedestrian, steps, living_street, residential, service, track, cycleway,
     bridleway, unclassified, tertiary, secondary, primary]

# Informative OSM keys kept per facility and shown in the app (popup, list), displayed as stored
# (no parsing of opening_hours). They never change counts (docs/osm_tagging.md §5).
facility_tags:
  [opening_hours, wheelchair, website, contact:website, phone, contact:phone, addr:street,
   addr:housenumber, addr:postcode, brand, operator, healthcare:speciality]

# Public transport supply classes (meth. §3, provisional until M2): bounds on the sum of
# weekday departures, inclusive; upper null = open-ended. Bounds must increase without gaps.
transit_classes:
  - {class: lack, lower: 0, upper: 0}
  - {class: insufficient, lower: 1, upper: 150}
  - {class: medium, lower: 151, upper: 1000}
  - {class: high, lower: 1001, upper: null}

# Reference weekday for transit departures (arch. §6.3, C7): the first `weekday` on or after the
# run date inside the GTFS validity that is no public or school holiday and has active services.
# Static data, never loaded at runtime. The run fails if the chosen day is outside `covered`.
reference_day:
  weekday: tuesday
  # Range for which the lists below are complete: school year 2026/27 and 2027/28 up to the end
  # of the Pfingstferien 2028 (summer 2028 not listed yet).
  covered: {from: 2026-07-30, to: 2028-06-17}
  # Public holidays in Baden-Württemberg (Feiertagsgesetz BW) inside `covered`.
  public_holidays:
    [2026-10-03, 2026-11-01, 2026-12-25, 2026-12-26,
     2027-01-01, 2027-01-06, 2027-03-26, 2027-03-29, 2027-05-01, 2027-05-06, 2027-05-17,
     2027-05-27, 2027-10-03, 2027-11-01, 2027-12-25, 2027-12-26,
     2028-01-01, 2028-01-06, 2028-04-14, 2028-04-17, 2028-05-01, 2028-05-25, 2028-06-05,
     2028-06-15]
  # School holidays and statewide school-free days in Baden-Württemberg, inclusive, school years
  # 2026/27 and 2027/28. Source: Kultusministerium BW, https://km.baden-wuerttemberg.de/de/service/ferien
  # (checked 2 Nov 2026). The four movable days per school are set by each school and not listed.
  school_holidays:
    - {from: 2026-07-30, to: 2026-09-12}  # Sommerferien 2026
    - {from: 2026-10-26, to: 2026-10-31}  # Herbstferien 2026 + Reformationsfest
    - {from: 2026-12-23, to: 2027-01-09}  # Weihnachtsferien
    - {from: 2027-03-25, to: 2027-03-25}  # school-free day before the Osterferien
    - {from: 2027-03-30, to: 2027-04-03}  # Osterferien 2027
    - {from: 2027-05-18, to: 2027-05-29}  # Pfingstferien 2027
    - {from: 2027-07-29, to: 2027-09-11}  # Sommerferien 2027
    - {from: 2027-11-02, to: 2027-11-06}  # Herbstferien 2027
    - {from: 2027-12-23, to: 2028-01-08}  # Weihnachtsferien
    - {from: 2028-04-13, to: 2028-04-13}  # school-free day (Gründonnerstag)
    - {from: 2028-04-18, to: 2028-04-22}  # Osterferien 2028
    - {from: 2028-06-06, to: 2028-06-17}  # Pfingstferien 2028

# Data sources (arch. §4). URLs checked on 2 Nov 2026 with curl -I.
sources:
  osm:
    # Geofabrik regional extract, updated daily; .md5 sidecar used to skip unchanged downloads.
    url: https://download.geofabrik.de/europe/germany/baden-wuerttemberg/tuebingen-regbez-latest.osm.pbf
    md5_url: https://download.geofabrik.de/europe/germany/baden-wuerttemberg/tuebingen-regbez-latest.osm.pbf.md5
    licence: ODbL 1.0
  gtfs:
    # NVBW GTFS for the naldo network ("mit Liniennetz").
    url: https://www.nvbw.de/fileadmin/user_upload/service/open_data/fahrplandaten_mit_liniennetz/naldo.zip
    licence: dl-de/by-2-0, ODbL
    # Files unpacked from the zip; shapes.txt (580 MB) is not needed.
    members: [stops.txt, stop_times.txt, trips.txt, calendar.txt, calendar_dates.txt, feed_info.txt]
  zensus:
    # Destatis Zensus 2022 population grid (10 km, 1 km and 100 m CSV in one zip).
    url: https://www.destatis.de/static/DE/zensus/gitterdaten/Zensus2022_Bevoelkerungszahl.zip
    licence: dl-de/by-2-0
    # 100 m grid; columns GITTER_ID_100m;x_mp_100m;y_mp_100m;Einwohner (checked 2 Nov 2026).
    members: [Zensus2022_Bevoelkerungszahl_100m-Gitter.csv]

# HTTP downloads in acquire: retries on network errors, timeouts and 5xx/429, waiting
# backoff_s * 2**attempt seconds between attempts; timeout_s per read.
download:
  retries: 4
  backoff_s: 5
  timeout_s: 60

# Valhalla tile build (arch. §6.1, C6) and the checks of `tiles verify` (P3).
tiles:
  # Production tiles are always built with elevation; the test clip builds without it.
  elevation: true
  # `tiles verify` routes this golden pair ([lon, lat], EPSG:4326) on the running Valhalla:
  # Marktplatz → Schloss Hohentübingen, a short steep route inside the test clip. The route
  # must exist and its length must lie between the straight line and max_detour_factor times
  # it; with elevation, its edges must carry grades (VF1).
  verify:
    route: [[9.0568, 48.5204], [9.0506, 48.5193]]
    costing: pedestrian
    max_detour_factor: 3.0

# Valhalla service used by the pipeline (arch. §6.5). The URL comes from the environment
# variable VALHALLA_URL (.env, passed by `make`; Compose sets http://valhalla:8002); `url` is
# only a fallback and stays null, so a run without .env fails clearly instead of calling
# whatever listens on a guessed local port (notes N9).
valhalla:
  url: null
  # Parallel requests; equals the worker threads of valhalla_service (compose.yaml, 2 = vCPUs).
  concurrency: 2
  # Seconds per request; retries with backoff_s * 2**attempt on timeouts, connection errors
  # and 5xx.
  timeout_s: 300
  retries: 3
  backoff_s: 2
  # Sources × targets per matrix request; must not exceed service_limits.<costing>
  # .max_matrix_location_pairs in config/valhalla.json. Larger target sets are split.
  max_matrix_pairs: 25000

# Counting (arch. §6.3, §6.5).
count:
  # Cells are grouped into square blocks of this size by their origin; one matrix per block
  # and profile (500 m: at most 25 sources, ~24k pairs for cycling in Tübingen, P3).
  block_size_m: 500
  # Prefilter evidence (O20): for the blocks around these points ([lon, lat]; the block of the
  # nearest scored cell) the candidates are widened to reach * widen_factor + widen_m, so
  # facilities beyond the prefilter reach are measured too. The highest implied speed
  # (straight line ÷ time) is reported per band of travel time, band_edges as fractions of the
  # budget: short pairs are dominated by the snap distance (not counted as time), the band ending
  # at the budget is the one that matters for the prefilter (P3 measurement).
  evidence:
    widen_factor: 1.5
    widen_m: 500
    band_edges: [0.1, 0.33, 0.67, 1.0]
    sample_points:
      centre: [9.0568, 48.5204]       # Marktplatz, old town
      steep: [9.0650, 48.5390]        # Waldhäuser-Ost, hilltop above the centre
      edge_north: [9.0050, 48.5460]   # Hagelloch, Teilort on the Schönbuch edge
      edge_south: [8.9480, 48.4880]   # Bühl, Teilort in the Neckar valley

# Recommender (meth. §5, arch. §6.4, §6.5 rule 7): where would one new facility of a category
# help most? Candidates = 100 m Zensus grid cells (populated or not) whose centre lies inside the
# urban boundary, outside the excluded land use below, and within the prefilter reach of a cell
# with a deficit for the profile. Catchment of a candidate = scored cells reaching its centre
# within the facility budget (matrix: cells as sources, candidates as targets, in groups).
# Greedy per category and profile: gain = reduction of the deficit sum
# sum P_i * [min(1, (A_i+1)/k) - min(1, A_i/k)] over the catchment (= ΔW, meth. §5).
recommend:
  # Profiles with recommendations. Cycling is left out for now (decision by Rico, 6 Nov 2026):
  # hardly any cycling deficit, and its large costmatrix requests grow Valhalla's memory (N4).
  # Empty list = the run has no recommendations (the app hides the layer).
  profiles: [walking_339, walking_500, wheelchair_339]
  # Ranked zones per category and profile (at most).
  top_n: 5
  # Selection stops when the best remaining gain (residents, deficit reduction) is below this.
  min_gain: 50
  # Candidate spacing on the Zensus grid; a multiple of 100 (100 = every grid cell).
  candidate_spacing_m: 100
  # Candidates are grouped in squares of this size; one matrix per group (rule 7): sources =
  # scored cells within the prefilter reach of the group, targets = the group's candidates.
  group_size_m: 500
  # OSM land use where no facility is recommended (polygons; a candidate is dropped if its
  # centre lies inside). industrial is kept on purpose: supermarkets and doctors are often in
  # commercial/industrial areas (decision by Rico, 6 Nov 2026).
  exclude_tags:
    - {landuse: forest}
    - {landuse: farmland}
    - {natural: water}
    - {natural: wood}
    - {leisure: nature_reserve}
  # boundary=protected_area is excluded only for these protect_class values (nature protection:
  # 1-4 strict reserves, wilderness, national parks, monuments/biotopes; 7 = other nature
  # protection, in BW e.g. Bannwald and protected biotopes). Not excluded: landscape protection
  # and nature parks (5, e.g. Naturpark Schönbuch covers villages), cultural heritage (22, e.g.
  # the Altstadt ensemble), resource and other classes (14, 97, …) and areas without
  # protect_class; recommend reports their count and area (decision by Rico, 6 Nov 2026).
  exclude_protect_classes: ["1", "2", "3", "4", "7"]

# Validation thresholds (arch. §7 "validate inputs").
validation:
  # Allowed relative deviation of the summed Zensus population from the official city total.
  population_tolerance_pct: 5
  # Official Zensus 2022 population of the city (15 May 2022), Statistisches Bundesamt, via
  # https://www.citypopulation.de/de/germany/census/baden_w%C3%BCrttemberg/08416041__t%C3%BCbingen/
  # (checked 2 Nov 2026). null = check is reported as warning only.
  official_population: 90499
  # Coverage (O11): residents of scored cells / residents of all populated cells touching the
  # city area must be at least this share (0..1); fewer fails validation.
  min_scored_share: 0.98
  # Minimum number of facilities per category; fewer fails validation.
  min_facilities_per_category: 1
  # Validation of results (arch. §7 "validate results", report part 2). Monotonicity: per pair,
  # the share of cells where `higher` has fewer facilities of any category (or fewer transit
  # departures, if both profiles have transit) than `lower`. Above warn_above the check warns,
  # above fail_above it fails and nothing is published (null = never fails). No pair is
  # guaranteed: Valhalla picks routes by cost, not time, so even 5.0 km/h can avoid steps that
  # 3.39 km/h takes (P4: 6 of 1,699 cells, notes N6); different costings are compared for
  # information only.
  results:
    monotonic:
      - {higher: walking_500, lower: walking_339, warn_above: 0, fail_above: 0.01}
      - {higher: cycling_15, lower: walking_339, warn_above: 0.05, fail_above: null}
      - {higher: walking_339, lower: wheelchair_339, warn_above: 0.05, fail_above: null}
    # Matrix time vs. /route time (known limitation, never fails): per profile
    # pairs_per_profile random reachable cell × facility pairs, near_budget_share of them with
    # time_s >= that share of the budget (where a deviation changes the count); warns if any
    # |Δ| exceeds warn_max_abs_s. Needs the running Valhalla (notes N8, P5).
    route_check:
      pairs_per_profile: 25
      near_budget_share: 0.8
      warn_max_abs_s: 60
    # Missed facilities (notes N9): per profile and category pairs_per_category random cell ×
    # facility pairs within the prefilter reach that are not in `reachable`, checked with
    # /route; a route within the budget is a false negative. Warns above warn_above, fails
    # above fail_above (share of the whole sample). Needs the running Valhalla.
    # Block costmatrix times are rarely longer than one-source times (~0.02 % of these pairs,
    # notes N9), so one hit in a sample of ~480 (0.2 %) stays ok; warn above 0.5 %, fail above 2 %.
    false_negatives:
      pairs_per_category: 20
      warn_above: 0.005
      fail_above: 0.02
    # Budget flips (meth. V10): per profile and direction the share of routed pairs on which the
    # matrix and /route lie on different sides of the budget, from the two samples above
    # (matrix within / route beyond: route_check, near the budget; matrix beyond / route within:
    # false_negatives). Known limitation, never fails; warns above warn_above (> 1 of 25).
    budget_flips:
      warn_above: 0.05

# PostGIS (arch. §8). Connection strings and passwords come from .env (DATABASE_URL_PIPELINE,
# DATABASE_URL_ADMIN, *_PASSWORD), never from this file.
database:
  # roles.sql, migrations/NNNN_*.sql and run_schema.sql (template of a run schema).
  sql_dir: infra/db
  # Connection attempts after the first one, waiting backoff_s * 2**attempt in between.
  connect_retries: 3
  backoff_s: 2

# cleanup stage (arch. §7): published runs kept (DB schemas, data/raw/<run_id>/,
# data/runs/<run_id>/); older runs are deleted. Fewer published runs = nothing is deleted.
cleanup:
  keep_published_runs: 3

# API (arch. §6.5 rules 8–12, §9), read by reach_api.settings; the pipeline ignores this section.
# URLs and the database DSN come from .env (VALHALLA_URL, DATABASE_URL_API), never from here.
api:
  # One isochrone call with these contours in minutes (rule 9); display only, never counted.
  isochrone:
    contours_min: [5, 10, 15]
    # Valhalla polygon simplification: generalize = tolerance in metres, denoise = 0..1 (drops
    # small islands); checked on Valhalla 3.9.1 (P5).
    generalize_m: 20
    denoise: 0.5
  # Next missing facility (W4): for every category where a cell has fewer than `k` facilities within
  # the budget, `/api/inspect` finds the fastest facility not yet counted. The `candidates` nearest
  # ones by straight line per category go into one live matrix (all categories together, from the
  # cell origin; arch. §6.5 rule 8), the fastest one gets a route, also beyond the 15-minute
  # budget. Facilities slower than `max_time_min` are not offered (answer: no facility, with a note).
  next_facility:
    candidates: 8
    max_time_min: 60
  # In-process LRU caches of serialized JSON bodies, keyed by run, endpoint, cell (or facility)
  # and profile (rule 10). Sizes measured in P5: worst case ~26 + 14 + 22 MB, within the API's
  # ~0.2 GB share of the server (arch. §11).
  cache:
    # inspect + catchment answers: 5–19 KB walking, up to ~52 KB cycling.
    live_entries: 500
    # expansion answers: ~0.48 MB walking, ~1.4 MB cycling (15 min).
    expansion_entries: 10
    # /api/cells (~0.7 MB), /api/districts (~0.3 MB) and small run data of the current run.
    read_entries: 32
  # Token bucket per client IP for the live endpoints: `burst` requests at once, refilled at
  # `per_minute`; at most `max_clients` buckets are kept (idle ones are dropped first).
  rate_limit:
    burst: 10
    per_minute: 30
    max_clients: 10000
  # Hosts whose X-Forwarded-For header is trusted (Caddy on the Compose network); the client IP
  # of any other peer is its own address. Names are resolved at start and re-resolved when an
  # unknown peer appears, at most every `resolve_interval_s`.
  trusted_proxies: [caddy]
  resolve_interval_s: 30
  # Live Valhalla calls: parallel requests, seconds per request, retries on timeouts and 5xx
  # after backoff_s * 2**attempt seconds.
  valhalla:
    concurrency: 2
    timeout_s: 20
    retries: 1
    backoff_s: 0.5
  # Live matrices (grid cells without residents, catchments): own client, because costmatrix
  # answers one source slowly (cycling ~2 s) and grows Valhalla's memory (P5, notes N8).
  live_matrix:
    concurrency: 1
    timeout_s: 10
    retries: 0
    backoff_s: 0.5
  # app_read connection pool (psycopg_pool).
  db_pool:
    min_size: 1
    max_size: 4
