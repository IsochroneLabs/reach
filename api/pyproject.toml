[project]
name = "reach-api"
version = "0.0.0"
description = "reach API: read endpoints from the current schema and live Valhalla endpoints"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reach_api"]
