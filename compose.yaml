# Local development stack (arch. §12). `make up` starts db, api and valhalla (once tiles exist).
# Profiles: "build" = valhalla-build (started by `make refresh`), "pipeline" = pipeline image.
# Host ports bind to 127.0.0.1 only; production uses compose.prod.yaml (S1.5) without published
# db/valhalla ports (AGENTS.md rule 10). The transit engine follows with T1 (S1.7).
name: reach

services:
  db:
    # Multi-arch (amd64 + arm64) build of the official PostGIS image; postgis/postgis is amd64 only.
    image: imresamu/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reach}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep PGDATA below /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  valhalla:
    image: ghcr.io/valhalla/valhalla:3.9.1
    # Serves $VALHALLA_DIR/valhalla_tiles.tar (built by `make refresh`); the last argument of
    # valhalla_service is the number of worker threads (notes N1).
    # Valhalla reads its config only at start: every start copies config/valhalla.json to
    # $VALHALLA_DIR/valhalla.effective.json and serves exactly that copy, so the effective config
    # can be checked against the repository file (notes N5). The config directory is mounted,
    # not the file: a single-file bind mount keeps the old inode after a git checkout.
    entrypoint: ["sh", "-euc"]
    command:
      - |
        cp /valhalla/config/valhalla.json /data/valhalla/valhalla.effective.json
        exec valhalla_service /data/valhalla/valhalla.effective.json 2
    volumes:
      - ./config:/valhalla/config:ro
      # Host bind mount (not a named volume), so `make refresh` swaps tiles with two `mv`.
      - ${VALHALLA_DIR:-./data/valhalla}:/data/valhalla
    ports:
      - "127.0.0.1:${VALHALLA_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  valhalla-build:
    image: ghcr.io/valhalla/valhalla:3.9.1
    # One-shot tile build started by `make refresh` on the host (O5). $VALHALLA_DIR/build is
    # mounted where the config expects the live files, so the build writes
    # build/valhalla_tiles.tar and never touches the tiles the service is using; the host then
    # swaps it in. Elevation tiles are cached in $VALHALLA_DIR/elevation across builds.
    # ELEVATION (true/false) and BBOX (min_lon,min_lat,max_lon,max_lat) come from the flag file
    # written by `pipeline tiles check`.
    profiles: [build]
    entrypoint: ["sh", "-euc"]
    command:
      - |
        conf=/tmp/valhalla.json
        if [ "$${ELEVATION}" = true ]; then
          valhalla_build_elevation -b "$${BBOX}" -o /data/valhalla/elevation -p 2
          cp /valhalla/config/valhalla.json "$$conf"
        else
          # Test clip: no elevation download, tiles without grades.
          python3 -c "import json, sys; c = json.load(open(sys.argv[1])); c['additional_data']['elevation'] = ''; json.dump(c, open(sys.argv[2], 'w'))" /valhalla/config/valhalla.json "$$conf"
        fi
        rm -rf /data/valhalla/tiles
        valhalla_build_tiles -c "$$conf" /data/valhalla/routing.osm.pbf
        valhalla_build_extract -c "$$conf" -O
        rm -rf /data/valhalla/tiles
        echo "build peak memory: $$(( $$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo 0) / 1048576 )) MB"
    environment:
      ELEVATION: ${ELEVATION:-true}
      BBOX: ${BBOX:-}
    volumes:
      - ./config:/valhalla/config:ro
      - ${VALHALLA_DIR:-./data/valhalla}/build:/data/valhalla
      - ${VALHALLA_DIR:-./data/valhalla}/elevation:/data/valhalla/elevation

  api:
    # Image from infra/api.Dockerfile (reach-api, no dev dependencies). Locally api/src and
    # config/ are bind-mounted and uvicorn reloads on changes; production (S1.5) runs the
    # image's own command without --reload.
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    image: reach-api:dev
    command: ["uvicorn", "reach_api.main:app", "--host=0.0.0.0", "--port=8000",
              "--no-proxy-headers", "--reload", "--reload-dir=api/src"]
    volumes:
      - ./api/src:/app/api/src:ro
      - ./config:/app/config:ro
    environment:
      DATABASE_URL_API: ${DATABASE_URL_API:?set DATABASE_URL_API in .env}
      VALHALLA_URL: http://valhalla:8002
      REACH_CONFIG: ${REACH_CONFIG:-config/config.yaml}
    ports:
      # `npm run dev` in web/ proxies /api to this port (local development only).
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  pipeline:
    # Image from infra/pipeline.Dockerfile (reach-pipeline + osmium). Locally the pipeline usually
    # runs on the host (`make pipeline`); this service is the form used on the server (S1.5).
    # Tile builds stay on the host (`make refresh`): no Docker socket in the pipeline (O5).
    build:
      context: .
      dockerfile: infra/pipeline.Dockerfile
    image: reach-pipeline:dev
    profiles: [pipeline]
    environment:
      REACH_CONFIG: ${REACH_CONFIG:-config/config.yaml}
      VALHALLA_URL: http://valhalla:8002
      DATABASE_URL_PIPELINE: postgresql://pipeline_write:${PIPELINE_WRITE_PASSWORD:-}@db:5432/${POSTGRES_DB:-reach}
      FAILURE_WEBHOOK_URL: ${FAILURE_WEBHOOK_URL:-}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
