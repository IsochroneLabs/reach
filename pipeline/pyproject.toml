[project]
name = "reach-pipeline"
version = "0.0.0"
description = "reach data pipeline: acquire, validate, tiles, count, score, recommend, publish"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1",
    "shapely>=2.1",
    "pyproj>=3.7",
    "pyarrow>=21.0",
    "pandas>=2.3",
    "numpy>=2.2",
    "duckdb>=1.4",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reach_pipeline"]
