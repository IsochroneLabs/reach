# CI for pull requests and pushes to dev; deploy.yml calls it on the commit it deploys.
# Job names are the required status checks on dev (docs/deployment.md): python, db-contract,
# web, docker-build. preview is optional: it deploys the web build to a Cloudflare preview.
# Third-party actions are pinned to commit SHAs (AGENTS.md, delivery rules).
name: ci

on:
  pull_request:
  push:
    branches: [dev]
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to check (set by deploy.yml)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.6" # same as the uv base image in infra/*.Dockerfile
  WRANGLER_VERSION: "4.166.0"

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install osmium-tool (pipeline OSM tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends osmium-tool
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  db-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgis:
        image: imresamu/postgis:18-3.6 # same image as compose.yaml
        env:
          POSTGRES_PASSWORD: ci-only # disposable container of this job, not a secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m db
        env:
          REACH_TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_BUILD_SHA: ${{ inputs.ref || github.sha }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [api, pipeline]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.image }} (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/${{ matrix.image }}.Dockerfile
          build-args: BUILD_SHA=${{ inputs.ref || github.sha }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Cloudflare preview for pull requests from branches of this repository and for dev.
  # Fork PRs get no secrets and skip it; inside deploy.yml (inputs.ref set) it never runs.
  # Without the Cloudflare secret (not created yet) it passes with a warning.
  preview:
    if: >-
      ${{ !inputs.ref && (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.wrangler.outputs.deployment-url }}
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      PREVIEW_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'dev' }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Skip without Cloudflare secret
        if: env.HAS_TOKEN != 'true'
        working-directory: . # runs before the checkout, web/ does not exist yet
        run: |
          echo "::warning title=Preview skipped::CLOUDFLARE_API_TOKEN is not set in the environment 'preview' (docs/deployment.md)"
          echo "Preview skipped: CLOUDFLARE_API_TOKEN not set in environment \`preview\`." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TOKEN == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_TOKEN == 'true'
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false # no cache in jobs that publish (cache poisoning)
      - if: env.HAS_TOKEN == 'true'
        run: npm ci && npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_API_BASE: ${{ vars.PREVIEW_API_BASE }}
      - name: Deploy the preview
        id: wrangler
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: web
          command: preview --name ${{ env.PREVIEW_NAME }}
      - name: Check the preview serves this build
        if: env.HAS_TOKEN == 'true'
        env:
          URL: ${{ steps.wrangler.outputs.deployment-url }}
          SHA: ${{ github.sha }}
        run: |
          test -n "$URL" || { echo "::error::wrangler printed no preview URL"; exit 1; }
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 "$URL" | grep -q "content=\"$SHA\""
          echo "Preview \`$PREVIEW_NAME\` of \`$SHA\`: $URL" >> "$GITHUB_STEP_SUMMARY"
