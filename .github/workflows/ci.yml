# Lint and unit tests, the PostGIS data-contract test and the web checks (lint, build, browser
# smoke test) on every push and pull request (arch. §11 "CI", §14.1).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Install osmium-tool (system binary used by the pipeline, see README)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends osmium-tool
          osmium --version | head -n 1

      - name: Install workspace (Python from .python-version, locked versions)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Tests
        run: uv run pytest

  # Data-contract test (docs/data_contract.md): roles, migrations, run schema, views and the
  # atomic switch of `current` against a disposable PostGIS (same image as compose.yaml).
  # Tests with the `db` marker only; no Valhalla, no data downloads.
  db-contract:
    runs-on: ubuntu-24.04
    services:
      postgis:
        image: imresamu/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REACH_TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Install workspace (Python from .python-version, locked versions)
        run: uv sync --frozen

      - name: Data-contract tests
        run: uv run pytest -m db

  # Frontend (web/, arch. §10): lint + type check, production build, and the browser smoke test
  # against recorded API responses (web/tests/fixtures/; no stack, no basemap, no network).
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (locked versions)
        run: npm ci --no-audit --no-fund

      - name: Lint + type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Bundle size (KB per file, raw and gzip)
        run: |
          for f in dist/assets/*; do
            echo "$(( $(wc -c < "$f") / 1024 )) KB raw, $(( $(gzip -9c "$f" | wc -c) / 1024 )) KB gzip  $f"
          done

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: npx playwright test

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
